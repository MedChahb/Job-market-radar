[project]
name = "job-market-radar"
version = "0.1.0"
description = "What the French data and AI job market asks for, the offers that fit your skills, and a decoder for any job offer."
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["radar"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[dependency-groups]
dev = [
    "ruff>=0.17.4",
]
