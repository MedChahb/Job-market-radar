[project]
name = "job-market-radar"
version = "0.1.0"
description = "What the French data and AI job market asks for, the offers that fit your skills, and a decoder for any job offer."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.8",
    "pydantic-settings>=2.16.2",
    "typer>=0.28.0",
]

[project.scripts]
radar = "radar.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["radar"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "respx>=0.23.1",
    "ruff>=0.17.4",
]
